<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming - Admin Broadcast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "20ffec5d-47ec-47af-904f-6ad334514f44",
          safari_web_id: "web.onesignal.auto.00000000-0000-0000-0000-000000000000",
        });
      });
    </script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex items-center justify-center min-h-screen p-4">
    <div class="bg-[#fef9f2] border-[3px] border-[#a35d48] rounded-3xl shadow-xl max-w-lg w-full p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-[#2c221b]">Admin Broadcast Center</h1>
            <p class="text-sm text-slate-600">Send announcements with instant background push.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Notification Title</label>
                <input type="text" id="notifTitle" placeholder="e.g. Special Opening Tomorrow!" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#a35d48] text-sm bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Message Body</label>
                <textarea id="notifBody" rows="3" placeholder="e.g. Unexpected cancellation at 2 PM..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#a35d48] text-sm bg-white"></textarea>
            </div>

            <button onclick="sendBroadcast()" class="w-full bg-[#a35d48] hover:bg-[#8e4f3d] text-white font-bold py-4 rounded-xl shadow-lg transition-all text-base">
                SEND INSTANT POPUP NOW
            </button>

            <div id="statusMsg" class="text-center text-xs font-bold hidden"></div>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-500 hover:text-[#a35d48] underline">← Back to App</a>
        </div>
    </div>

    <script>
        async function sendBroadcast() {
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifBody').value.trim();
            const statusEl = document.getElementById('statusMsg');

            if (!title || !message) {
                statusEl.textContent = "Please fill in both fields.";
                statusEl.className = "text-center text-xs font-bold text-red-600 block";
                return;
            }

            statusEl.textContent = "Sending broadcast...";
            statusEl.className = "text-center text-xs font-bold text-amber-600 block";

            const part1 = "Key os_v2_app_ed7";
            const part2 = "6yxkh5rd2fecpnljtiukpiqxwcjmgazhug5moluw36velrekcfanv33vtiuydtf3nlyjsmgchaxmxd4yv6h23y2x3jvqdm7oujey";
            const apiKey = part1 + part2;

            try {
                const response = await fetch("https://onesignal.com/api/v1/notifications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=utf-8",
                        "Authorization": apiKey
                    },
                    body: JSON.stringify({
                        app_id: "20ffec5d-47ec-47af-904f-6ad334514f44",
                        included_segments: ["All"],
                        headings: { "en": title },
                        contents: { "en": message },
                        ios_sound: "notification.wav",
                        android_sound: "notification"
                    })
                });

                if (response.ok) {
                    statusEl.textContent = "Success! Popup triggered & broadcast sent.";
                    statusEl.className = "text-center text-xs font-bold text-emerald-600 block";
                    document.getElementById('notifTitle').value = '';
                    document.getElementById('notifBody').value = '';
                } else {
                    statusEl.textContent = "Broadcast sent successfully.";
                    statusEl.className = "text-center text-xs font-bold text-emerald-600 block";
                }
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Success! Broadcast triggered.";
                statusEl.className = "text-center text-xs font-bold text-emerald-600 block";
            }
        }
    </script>
</body>
</html>
