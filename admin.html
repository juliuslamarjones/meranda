<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-[480px] bg-[#fef9f2] rounded-3xl shadow-lg border-[3px] border-[#a35d48] p-6 text-center space-y-6">
        <div class="space-y-1">
            <h2 class="text-xl font-bold text-[#2c221b]">Admin Broadcast Center ??</h2>
            <p class="text-xs text-slate-600">Send push announcements directly to all customer devices.</p>
        </div>

        <!-- Quick OneSignal Dashboard Shortcut (Bypasses Browser CORS instantly) -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-left space-y-2">
            <p class="text-xs font-bold text-amber-900">?? Quickest Way to Broadcast:</p>
            <p class="text-[11px] text-amber-800">Because browsers block direct API calls to external servers (CORS), use the official OneSignal dashboard to send messages instantly:</p>
            <a href="https://app.onesignal.com/" target="_blank" class="block text-center bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded-xl text-xs transition shadow">
                Open OneSignal Dashboard ?
            </a>
        </div>

        <div class="space-y-4 text-left border-t border-slate-200 pt-4">
            <div>
                <label class="block text-xs font-bold text-[#2c221b] mb-1">Notification Title</label>
                <input type="text" id="notifTitle" class="w-full p-3 text-xs rounded-xl border border-[#e6d5c3] bg-white focus:outline-none focus:ring-2 focus:ring-[#a35d48]" placeholder="e.g. Special Opening Tomorrow!">
            </div>

            <div>
                <label class="block text-xs font-bold text-[#2c221b] mb-1">Message Body</label>
                <textarea id="notifBody" rows="3" class="w-full p-3 text-xs rounded-xl border border-[#e6d5c3] bg-white focus:outline-none focus:ring-2 focus:ring-[#a35d48]" placeholder="e.g. We have an unexpected cancellation at 2 PM..."></textarea>
            </div>

            <button onclick="copyPayload()" class="w-full bg-[#a35d48] hover:bg-[#8f4e3c] text-white font-bold py-3 px-6 rounded-xl shadow-md transition text-xs cursor-pointer">
                ?? Copy Notification Text for Broadcast
            </button>
        </div>

        <div id="statusMessage" class="text-xs font-medium hidden"></div>

        <div>
            <a href="index.html" class="text-xs text-slate-500 hover:text-[#a35d48] underline">? Back to App</a>
        </div>
    </div>

    <script>
        function copyPayload() {
            const title = document.getElementById("notifTitle").value.trim();
            const message = document.getElementById("notifBody").value.trim();
            const statusEl = document.getElementById("statusMessage");

            if (!title || !message) {
                statusEl.textContent = "Please fill out both the title and message body first.";
                statusEl.className = "text-xs font-medium text-red-600";
                statusEl.classList.remove("hidden");
                return;
            }

            const textToCopy = `Title: ${title}\nMessage: ${message}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                statusEl.textContent = "Copied to clipboard! Paste it into your OneSignal Dashboard message box ??";
                statusEl.className = "text-xs font-bold text-green-700";
                statusEl.classList.remove("hidden");
            }).catch(err => {
                statusEl.textContent = "Failed to copy text.";
                statusEl.className = "text-xs font-medium text-red-600";
                statusEl.classList.remove("hidden");
            });
        }
    </script>
</body>
</html>
