<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming | Admin Broadcast Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex justify-center p-4 min-h-screen">
    <div class="w-full max-w-[480px] bg-white rounded-2xl shadow-lg border-[3px] border-[#a35d48] overflow-hidden flex flex-col h-fit">
        <div class="bg-[#2c221b] text-white p-6 text-center">
            <h1 class="text-lg font-bold">Meranda's Grooming</h1>
            <p class="text-xs text-[#d5ccc0] mt-1">Admin Broadcast Portal</p>
        </div>
        <div class="p-6 space-y-4">
            <div id="auth-screen" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter admin password" class="w-full p-3 border border-[#e8e1d7] rounded-xl text-sm focus:outline-none focus:border-[#a35d48]">
                <input type="password" id="api-key-input" placeholder="Paste OneSignal API Key (os_v2_app_...)" class="w-full p-3 border border-[#e8e1d7] rounded-xl text-sm focus:outline-none focus:border-[#a35d48]">
                <button onclick="authenticate()" class="w-full bg-[#a35d48] text-white font-semibold py-3 rounded-xl shadow-md">Access Portal</button>
            </div>
            <div id="broadcast-screen" class="hidden space-y-4">
                <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 font-medium">
                    ✓ Authenticated. Send an instant push update below.
                </div>
                <input type="text" id="notif-title" value="Meranda's Grooming Update 🐾" class="w-full p-3 border border-[#e8e1d7] rounded-xl text-sm">
                <textarea id="notif-message" rows="4" placeholder="Type your broadcast message here..." class="w-full p-3 border border-[#e8e1d7] rounded-xl text-sm resize-none"></textarea>
                <button onclick="sendBroadcast()" id="send-btn" class="w-full bg-[#2c221b] text-white font-semibold py-3 rounded-xl shadow-md">Broadcast to All Clients 🚀</button>
                <div id="status-msg" class="text-xs text-center font-medium mt-2"></div>
            </div>
        </div>
    </div>
    <script>
        let savedApiKey = "";

        function authenticate() {
            const pass = document.getElementById('admin-pass').value.trim();
            const key = document.getElementById('api-key-input').value.trim();

            if (pass === "1234" && key) {
                savedApiKey = key;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('broadcast-screen').classList.remove('hidden');
            } else { 
                alert("Please check your password (1234) and ensure you pasted the API key."); 
            }
        }

        async function sendBroadcast() {
            const title = document.getElementById('notif-title').value;
            const message = document.getElementById('notif-message').value;
            const statusMsg = document.getElementById('status-msg');
            const sendBtn = document.getElementById('send-btn');

            if (!message || !message.trim()) {
                alert("Please type a message in the box before broadcasting.");
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = "Sending Broadcast...";
            statusMsg.className = "text-xs text-center font-medium mt-2 text-slate-500";
            statusMsg.innerText = "Dispatching notification...";

            try {
                const response = await fetch("https://corsproxy.io/?https://onesignal.com/api/v1/notifications", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json; charset=utf-8",
                        "Authorization": "Key " + savedApiKey
                    },
                    body: JSON.stringify({
                        app_id: "20ffec5d-47ec-47a2-904f-6ad334514f44",
                        included_segments: ["Total Subscriptions"],
                        headings: { en: title },
                        contents: { en: message }
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    statusMsg.className = "text-xs text-center font-medium mt-2 text-emerald-700";
                    statusMsg.innerText = "✓ Success! Notification ID: " + data.id;
                    document.getElementById('notif-message').value = "";
                } else {
                    statusMsg.className = "text-xs text-center font-medium mt-2 text-rose-700";
                    statusMsg.innerText = "⚠️ Server Error: " + JSON.stringify(data.errors || data);
                }
            } catch (err) {
                statusMsg.className = "text-xs text-center font-medium mt-2 text-rose-700";
                statusMsg.innerText = "⚠️ Error: " + err.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "Broadcast to All Clients 🚀";
            }
        }
    </script>
</body>
</html>
