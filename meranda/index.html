<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "20ffec5d-47ec-47a2-904f-6ad334514f44",
          safari_web_id: "web.onesignal.auto.00000000-0000-0000-0000-000000000000",
          notifyButton: {
            enable: true,
          },
        });
      });
    </script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-[500px] bg-[#fef9f2] rounded-3xl shadow-xl border-[3px] border-[#a35d48] p-6 space-y-6 text-center">
        <h1 class="text-2xl font-bold text-[#2c221b]">Meranda's Grooming 🐾</h1>
        <p class="text-sm text-slate-600">Pampering Your Furry Friends!</p>

        <div class="bg-white p-4 rounded-2xl border border-[#e6d5c3] space-y-3">
            <h2 class="font-bold text-sm text-[#2c221b]">Never Miss an Update!</h2>
            <p class="text-xs text-slate-500">Tap below to turn on instant push notifications for schedule openings.</p>
            <button onclick="OneSignal.Slidedown.promptPush()" class="w-full bg-[#a35d48] text-white font-bold text-xs py-3 rounded-xl uppercase tracking-wider">
                Enable Push Notifications 🔔
            </button>
        </div>

        <!-- Prominent Admin Portal Button -->
        <div class="pt-2">
            <a href="admin.html" class="block w-full bg-[#2c221b] text-white font-bold text-xs py-3 rounded-xl uppercase tracking-wider hover:bg-[#43352b] transition">
                Open Admin Portal 🔒
            </a>
        </div>
    </div>

</body>
</html>
