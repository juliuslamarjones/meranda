<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's In-Home Grooming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        .push-btn {
            width: 100%;
            background-color: #a35d48;
            color: white;
            font-weight: bold;
            font-size: 14px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .active-btn { background-color: #15803d !important; }
    </style>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex flex-col items-center p-4 min-h-screen">
    <div class="w-full max-w-[480px] bg-[#fef9f2] rounded-3xl shadow-lg border-[3px] border-[#a35d48] overflow-hidden my-auto relative pb-6">
        
        <!-- Live Broadcast Banner Container -->
        <div id="broadcastBanner" class="hidden bg-[#a35d48] text-white p-4 text-center relative shadow-inner">
            <h4 id="bannerTitle" class="font-bold text-sm uppercase tracking-wide"></h4>
            <p id="bannerMessage" class="text-xs mt-1 text-slate-100"></p>
        </div>

        <div class="w-full relative">
            <img src="flyer.jpg" alt="Meranda's Grooming Flyer" class="w-full object-cover">
        </div>

        <div class="px-6 text-center space-y-5 mt-4">
            <div class="space-y-1">
                <h2 class="text-xl font-bold text-[#2c221b]">Pampering Your Furry Friends!</h2>
                <p class="text-xs text-slate-600 font-medium">Book your appointments and stay updated on schedule openings.</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-[#e6d5c3] shadow-sm text-left space-y-3">
                <div class="flex items-center gap-2 justify-center">
                    <span class="text-lg">🔔</span>
                    <h3 class="text-xs font-bold text-[#2c221b] uppercase tracking-wider">Never Miss an Update!</h3>
                </div>
                <button id="enablePushBtn" class="push-btn" onclick="logClick()">
                    Enable Alerts 🔔
                </button>
                <div class="text-center pt-2">
                    <a href="admin.html" class="text-[10px] text-slate-400 hover:text-[#a35d48] underline">Admin Portal</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxFse5ziXWYyzOimzdWjqNNDgsvzD-rvo",
            authDomain: "meranda-grooming.firebaseapp.com",
            projectId: "meranda-grooming",
            storageBucket: "meranda-grooming.firebasestorage.app",
            messagingSenderId: "583723658573",
            appId: "1:583723658573:web:e9e074ffacbf29f1ad5b04"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        // Fetch latest broadcast immediately on load
        db.collection("broadcasts").orderBy("timestamp", "desc").limit(1).get().then((snapshot) => {
            if (!snapshot.empty) {
                const data = snapshot.docs[0].data();
                document.getElementById("bannerTitle").textContent = data.title;
                document.getElementById("bannerMessage").textContent = data.message;
                document.getElementById("broadcastBanner").classList.remove("hidden");
            }
        });

        async function logClick() {
            const btn = document.getElementById("enablePushBtn");
            btn.textContent = "Alerts Active ✓";
            btn.className = "push-btn active-btn";
            try {
                await db.collection("meranda_taps").add({
                    action: "push_notification_click",
                    userAgent: navigator.userAgent,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
