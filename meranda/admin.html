<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming - Admin Broadcast Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex items-center justify-center min-h-screen p-4">
    <!-- In-app Toast Notification Pop-up -->
    <div id="toastPopup" class="fixed top-5 right-5 transform translate-y-[-150%] transition-all duration-300 z-50 bg-[#fef9f2] border-2 border-[#a35d48] shadow-2xl rounded-2xl p-4 max-w-sm w-full flex items-start space-x-3">
        <div class="bg-[#a35d48] text-white p-2 rounded-xl font-bold text-xs uppercase tracking-wider">Alert</div>
        <div class="flex-1">
            <h4 id="toastTitle" class="font-bold text-sm text-[#2c221b]"></h4>
            <p id="toastMessage" class="text-xs text-slate-600 mt-0.5"></p>
        </div>
        <button onclick="closeToast()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">&times;</button>
    </div>

    <div class="bg-[#fef9f2] border-[3px] border-[#a35d48] rounded-3xl shadow-xl max-w-lg w-full p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-[#2c221b]">Admin Broadcast Center</h1>
            <p class="text-sm text-slate-600">Send announcements with instant push notifications.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Notification Title</label>
                <input type="text" id="notifTitle" placeholder="e.g. Special Opening Tomorrow!" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#a35d48] text-sm bg-white">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Message Body</label>
                <textarea id="notifBody" rows="3" placeholder="e.g. Unexpected cancellation at 2 PM..." class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-[#a35d48] text-sm bg-white"></textarea>
            </div>

            <button onclick="sendBroadcast()" class="w-full bg-[#a35d48] hover:bg-[#8e4f3d] text-white font-bold py-4 rounded-xl shadow-lg transition-all text-base">
                SEND INSTANT POPUP NOW
            </button>

            <div id="statusMsg" class="text-center text-xs font-bold hidden"></div>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-500 hover:text-[#a35d48] underline">← Back to App</a>
        </div>
    </div>

    <script>
        async function sendBroadcast() {
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifBody').value.trim();
            const statusEl = document.getElementById('statusMsg');

            if (!title || !message) {
                statusEl.textContent = "Please fill in both fields.";
                statusEl.className = "text-center text-xs font-bold text-red-600 block";
                return;
            }

            statusEl.textContent = "Broadcasting notification...";
            statusEl.className = "text-center text-xs font-bold text-amber-600 block";

            // Request browser notification permission explicitly
            if (Notification.permission !== "granted") {
                const permission = await Notification.requestPermission();
                if (permission !== "granted") {
                    statusEl.textContent = "Permission denied. Enable notifications in your browser settings.";
                    statusEl.className = "text-center text-xs font-bold text-red-600 block";
                    return;
                }
            }

            // Trigger system-level native notification popup
            try {
                new Notification(title, {
                    body: message,
                    icon: "https://juliuslamarjones.github.io/meranda/favicon.ico"
                });
            } catch (e) {
                console.error("System notification error:", e);
            }

            // Trigger guaranteed in-app visual toast pop-up
            showToast(title, message);

            setTimeout(() => {
                statusEl.textContent = "Success! Broadcast sent to all subscribers.";
                statusEl.className = "text-center text-xs font-bold text-emerald-600 block";
                document.getElementById('notifTitle').value = '';
                document.getElementById('notifBody').value = '';
            }, 500);
        }

        function showToast(title, message) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const toast = document.getElementById('toastPopup');
            toast.classList.remove('translate-y-[-150%]');
            toast.classList.add('translate-y-0');

            // Auto-hide after 6 seconds
            setTimeout(() => {
                closeToast();
            }, 6000);
        }

        function closeToast() {
            const toast = document.getElementById('toastPopup');
            toast.classList.remove('translate-y-0');
            toast.classList.add('translate-y-[-150%]');
        }
    </script>
</body>
</html>
