<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meranda's Grooming - Admin Broadcast Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f7f4ee] text-[#3e3226] flex flex-col items-center p-4 min-h-screen">
    <div class="w-full max-w-[480px] bg-[#fef9f2] rounded-3xl shadow-lg border-[3px] border-[#a35d48] overflow-hidden my-auto p-6 space-y-6">
        <div class="text-center space-y-1">
            <h2 class="text-2xl font-bold text-[#2c221b]">Admin Broadcast Center</h2>
            <p class="text-xs text-slate-600 font-medium">Send announcements with instant popup.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Notification Title</label>
                <input type="text" id="notifTitle" placeholder="e.g. Special Opening Tomorrow!" class="w-full p-3 rounded-xl border border-[#e6d5c3] bg-white text-sm focus:outline-none focus:border-[#a35d48]">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-[#3e3226] mb-1">Message Body</label>
                <textarea id="notifMessage" rows="3" placeholder="e.g. Unexpected cancellation at 2 PM..." class="w-full p-3 rounded-xl border border-[#e6d5c3] bg-white text-sm focus:outline-none focus:border-[#a35d48]"></textarea>
            </div>
            
            <button onclick="sendBroadcast()" class="w-full bg-[#a35d48] hover:bg-[#8e4f3c] text-white font-bold text-sm py-4 rounded-xl shadow-md cursor-pointer transition">
                SEND INSTANT POPUP NOW
            </button>
            
            <div id="statusMsg" class="text-center text-xs font-bold h-4"></div>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-400 hover:text-[#a35d48] underline">← Back to App</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDxFse5ziXWYyzOimzdWjqNNDgsvzD-rvo",
            authDomain: "meranda-grooming.firebaseapp.com",
            projectId: "meranda-grooming",
            storageBucket: "meranda-grooming.firebasestorage.app",
            messagingSenderId: "583723658573",
            appId: "1:583723658573:web:e9e074ffacbf29f1ad5b04"
        };
        
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }
        const db = firebase.firestore();

        async function sendBroadcast() {
            const title = document.getElementById("notifTitle").value.trim();
            const message = document.getElementById("notifMessage").value.trim();
            const status = document.getElementById("statusMsg");

            if (!title || !message) {
                status.style.color = "red";
                status.textContent = "Please fill in both title and message.";
                return;
            }

            status.style.color = "#64748b";
            status.textContent = "Sending broadcast...";

            try {
                // Ensure Firestore writes without relying on local cache locks
                await db.collection("broadcasts").add({
                    title: title,
                    message: message,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                if (window.Notification && Notification.permission === "granted") {
                    new Notification(title, { body: message });
                }

                status.style.color = "green";
                status.textContent = "Success! Popup triggered & broadcast sent.";
                document.getElementById("notifTitle").value = "";
                document.getElementById("notifMessage").value = "";
            } catch (error) {
                console.error("Broadcast error details:", error);
                status.style.color = "red";
                status.textContent = "Error: " + (error.message || error.code || "Unknown error");
            }
        }
    </script>
</body>
</html>
